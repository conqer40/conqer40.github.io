<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم إيفا</title>
<style>
:root{
  --bg:#070b17;--bg2:#0b1224;--card:#101a33;--card2:#142042;--line:#22305a;--text:#e9efff;--mut:#8fa1cf;
  --acc:#5b8cff;--acc2:#8b5cf6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 100% -10%,#1a2a66 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#2a1a5e 0%,transparent 55%),var(--bg);
  color:var(--text);font:15px/1.65 "Segoe UI",Tahoma,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;background:#0a1229;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.18)}
label{display:block;color:var(--mut);font-size:12.5px;margin:0 2px 5px}
button{cursor:pointer;border:0;border-radius:12px;padding:9px 16px;background:#1a2750;transition:.15s}
button:hover{filter:brightness(1.15)}button:active{transform:scale(.97)}
.btn-acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(91,140,255,.28)}
.btn-ok{background:var(--ok);color:#04210f;font-weight:700}.btn-bad{background:var(--bad);color:#fff}.btn-ghost{background:transparent;border:1px solid var(--line)}
.hide{display:none!important}.mut{color:var(--mut)}.small{font-size:12.5px}.mono{font-family:Consolas,monospace;direction:ltr;text-align:left}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:390px;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:26px;padding:30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{width:68px;height:68px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 14px 40px rgba(91,140,255,.4)}
.login-card h1{margin:0 0 4px;font-size:22px}.login-card p{margin:0 0 20px;color:var(--mut)}

/* shell */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
aside{position:sticky;top:0;height:100vh;padding:18px 14px;border-inline-start:1px solid var(--line);background:rgba(8,13,28,.7);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:42px;height:42px;font-size:20px;border-radius:14px;margin:0}
.brand b{display:block;font-size:16px}.brand small{color:var(--mut)}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:right;background:transparent;padding:11px 12px;color:var(--mut)}
nav button .ic{font-size:18px;width:24px;text-align:center}
nav button.on{background:linear-gradient(135deg,rgba(91,140,255,.22),rgba(139,92,246,.18));color:#fff;box-shadow:inset 0 0 0 1px rgba(91,140,255,.35)}
nav .badge{margin-inline-start:auto;background:var(--warn);color:#2a1a00;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
.sp{flex:1}
main{padding:26px 28px 40px;max-width:1180px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h2{margin:0;font-size:24px}.top .sub{color:var(--mut)}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.stat{display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.stat .n{font-size:32px;font-weight:800;line-height:1.1}.stat .l{color:var(--mut);font-size:13px}
.stat::after{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--c,var(--acc));opacity:.16}
h3{margin:0 0 12px;font-size:16px}

/* users */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#0d1733;border:1px solid var(--line);color:var(--mut);padding:6px 13px;border-radius:99px;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ulist{display:grid;gap:10px}
.urow{display:grid;grid-template-columns:46px 1.3fr 1fr 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:.15s}
.urow:hover{border-color:var(--acc);transform:translateY(-1px)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.badge2{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:600}
.s-pending{background:#3a2d0a;color:var(--warn)}.s-active{background:#0c3320;color:var(--ok)}.s-blocked{background:#3b1212;color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
.req{color:var(--warn);font-size:12px}
.empty{padding:44px 10px;text-align:center;color:var(--mut)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(2,5,15,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(160deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.modal header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.x{margin-inline-start:auto;background:#1a2750;width:36px;height:36px;padding:0;border-radius:50%}
.row{display:grid;gap:12px}.two{grid-template-columns:1fr 1fr}
.keyrow{position:relative}.keyrow button{position:absolute;inset-inline-start:6px;top:27px;padding:5px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* seg + preview */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#0d1733;border:1px solid var(--line);color:var(--mut);padding:8px 14px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.phone{background:#0a0f20;border:1px solid var(--line);border-radius:22px;padding:14px;max-width:340px}
.notif{background:#1b2547;border-radius:16px;padding:12px 14px}
.notif .t{font-weight:700}.notif .b{color:#cdd8ff;margin-top:2px}
.notif .go{display:inline-block;margin-top:9px;background:var(--acc);color:#fff;border-radius:99px;padding:5px 14px;font-size:13px}
.nitem{padding:12px 0;border-top:1px solid var(--line)}.nitem:first-child{border-top:0}

/* toast */
#toasts{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);display:grid;gap:8px;z-index:99}
.toast{background:#17224a;border:1px solid var(--line);border-radius:14px;padding:11px 18px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:up .25s}
.toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--bad)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.sk{height:64px;border-radius:16px;background:linear-gradient(90deg,#0f1a38,#16244d,#0f1a38);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

@media(max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px;border:0;border-top:1px solid var(--line);z-index:40;background:rgba(7,11,23,.95)}
  .brand,.sp,.logout{display:none}
  nav{flex-direction:row;width:100%;justify-content:space-around}
  nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;width:auto}
  nav .badge{position:absolute;margin:0;transform:translate(14px,-4px)}
  main{padding:18px 14px 96px}
  .g4,.g5{grid-template-columns:1fr 1fr}.g3,.g2,.two{grid-template-columns:1fr}
  .urow{grid-template-columns:44px 1fr auto}.urow .c3,.urow .c4{display:none}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="logo">🤖</div>
    <h1>لوحة تحكم إيفا</h1>
    <p>أدخل كلمة مرور الإدارة للمتابعة</p>
    <div class="row">
      <input id="pw" type="password" placeholder="كلمة مرور الإدارة" autocomplete="current-password">
      <button class="btn-acc" id="loginBtn">دخول</button>
      <div id="lerr" class="small" style="color:var(--bad)"></div>
    </div>
  </div>
</div>

<div id="app" class="hide">
  <aside>
    <div class="brand"><div class="logo">🤖</div><div><b>إيفا AI</b><small>لوحة الإدارة</small></div></div>
    <nav id="nav">
      <button data-v="overview" class="on"><span class="ic">📊</span>نظرة عامة</button>
      <button data-v="users"><span class="ic">👥</span>المستخدمون<span class="badge hide" id="pendBadge">0</span></button>
      <button data-v="reports"><span class="ic">📈</span>التقارير<span class="badge hide" id="qBadge">0</span></button>
      <button data-v="keys"><span class="ic">🔑</span>المفاتيح<span class="badge hide" id="keyBadge">0</span></button>
      <button data-v="notices"><span class="ic">🔔</span>الإشعارات</button>
      <button data-v="updates"><span class="ic">🚀</span>التحديثات</button>
      <button data-v="settings"><span class="ic">⚙️</span>الإعدادات</button>
    </nav>
    <div class="sp"></div>
    <button class="btn-ghost logout" id="logout">تسجيل الخروج</button>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script>window.EVA_API="https://eva-platform.conqer40.workers.dev";</script>
<script>
const API = window.EVA_API || "";
let PW = sessionStorage.getItem("eva_pw") || "";
let USERS = [], NOTICES = [], SETTINGS = {}, STATS = null, POOL = [], poolShowUsed = false, POOLINFO = { stock: { gemini: 0, groq: 0 }, auto_activate: true, waiting: 0 };
let view = "overview", filter = "all", query = "";
let composer = { kind: "text", target: "all", title: "", body: "", url: "", when: "", users: [] };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" }) : "—";
const ago = iso => { if (!iso) return "لم يظهر بعد"; const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 2) return "الآن"; if (m < 60) return `منذ ${m} دقيقة`; if (m < 1440) return `منذ ${Math.round(m / 60)} ساعة`; return `منذ ${Math.round(m / 1440)} يوم`; };
const STATUS = { pending: "بانتظار التفعيل", active: "مفعّل", blocked: "موقوف" };

async function api(path, opt = {}) {
  const r = await fetch(API + path, { ...opt, headers: { "content-type": "application/json", "x-admin-password": PW, ...(opt.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "حدث خطأ");
  return d;
}
function toast(msg, type = "ok") {
  const t = document.createElement("div"); t.className = "toast " + type; t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ---------- login ---------- */
async function enter() {
  PW = $("#pw").value; $("#lerr").textContent = "";
  try { await api("/api/admin/users"); sessionStorage.setItem("eva_pw", PW); start(); }
  catch (e) { $("#lerr").textContent = e.message; }
}
$("#loginBtn").onclick = enter; $("#pw").onkeydown = e => { if (e.key === "Enter") enter(); };
$("#logout").onclick = () => { sessionStorage.removeItem("eva_pw"); location.reload(); };

async function start() {
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#main").innerHTML = `<div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;
  await loadAll(); show("overview");
}
async function loadAll() {
  const [u, n, s, st, pl] = await Promise.all([api("/api/admin/users"), api("/api/admin/notifications"), api("/api/admin/settings"), api("/api/admin/stats"), api("/api/admin/pool")]);
  USERS = u.users; NOTICES = n.notifications; SETTINGS = s; STATS = st; POOL = pl.keys; POOLINFO = pl;
  const low = Math.min(pl.stock.gemini, pl.stock.groq); $("#keyBadge").textContent = pl.waiting ? "⚠" + pl.waiting : low; $("#keyBadge").classList.toggle("hide", !pl.waiting && low > 3);
  const q = new Set((st.quota_alerts || []).map(x => x.uid)).size; $("#qBadge").textContent = q; $("#qBadge").classList.toggle("hide", !q);
  const pend = USERS.filter(x => x.status === "pending" && x.requested_at).length;
  $("#pendBadge").textContent = pend; $("#pendBadge").classList.toggle("hide", !pend);
}
document.getElementById("nav").onclick = e => { const b = e.target.closest("button[data-v]"); if (b) show(b.dataset.v); };
function show(v) {
  view = v;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  ({ overview: rOverview, users: rUsers, reports: rReports, keys: rKeys, notices: rNotices, updates: rUpdates, settings: rSettings })[v]();
  window.scrollTo(0, 0);
}
const head = (title, sub, extra = "") => `<div class="top"><div><h2>${title}</h2><div class="sub">${sub}</div></div><div style="margin-inline-start:auto;display:flex;gap:8px">${extra}</div></div>`;


/* ---------- ready-made API keys ---------- */
const maskKey = k => k.length > 14 ? k.slice(0, 6) + "••••••••" + k.slice(-4) : "••••";
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch { const a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); const ok = document.execCommand("copy"); a.remove(); return ok; }
}
async function poolRefresh() { const pl = await api("/api/admin/pool"); POOL = pl.keys; POOLINFO = pl; const low = Math.min(pl.stock.gemini, pl.stock.groq); $("#keyBadge").textContent = pl.waiting ? "⚠" + pl.waiting : low; $("#keyBadge").classList.toggle("hide", !pl.waiting && low > 3); await loadUsersQuiet(); rKeys(); }
async function loadUsersQuiet() { try { USERS = (await api("/api/admin/users")).users; } catch {} }
async function setAuto(on) { await api("/api/admin/settings", { method: "POST", body: JSON.stringify({ auto_activate: on ? "1" : "0" }) }); SETTINGS.auto_activate = on ? "1" : "0"; POOLINFO.auto_activate = on; toast(on ? "التفعيل التلقائي مفعّل" : "التفعيل التلقائي متوقف"); rKeys(); }
async function poolCopy(id) {
  const k = POOL.find(x => x.id === id); if (!k) return;
  const ok = await copyText(k.api_key);
  if (!ok) return toast("تعذر النسخ، انسخ يدويًا", "bad");
  try { await api("/api/admin/pool/" + id + "/use", { method: "POST", body: JSON.stringify({}) }); await poolRefresh(); toast("تم النسخ ووُضعت علامة «مستخدم» ✔"); } catch (e) { toast(e.message, "bad"); }
}
async function poolNext(provider) {
  const k = POOL.find(x => x.provider === provider && !x.used);
  if (!k) return toast("لا يوجد مفتاح متاح، أضف مفاتيح جديدة", "bad");
  await poolCopy(k.id);
}
async function poolReset(id) { await api("/api/admin/pool/" + id + "/reset", { method: "POST", body: "{}" }); await poolRefresh(); toast("أُعيد المفتاح لقائمة المتاح"); }
async function poolDelete(id) { if (!confirm("حذف هذا المفتاح نهائيًا من القائمة؟")) return; await api("/api/admin/pool/" + id, { method: "DELETE" }); await poolRefresh(); toast("تم الحذف"); }
async function poolAdd(provider) {
  const ta = $("#pk-" + provider), label = $("#pl-" + provider);
  try { const r = await api("/api/admin/pool", { method: "POST", body: JSON.stringify({ provider, keys: ta.value, label: label.value, pool: ($("#pp-" + provider) || {}).value || "users" }) }); toast(`أُضيف ${r.added} مفتاح` + (r.duplicates ? ` (${r.duplicates} مكرر تم تجاهله)` : "") + (r.activated ? ` • فُعّل ${r.activated} مستخدم تلقائيًا` : "")); ta.value = ""; await poolRefresh(); }
  catch (e) { toast(e.message, "bad"); }
}
function rKeys() {
  const col = (provider, title, ic) => {
    const all = POOL.filter(k => k.provider === provider);
    const free = all.filter(k => !k.used).length;
    const auto = POOLINFO.stock[provider] || 0;
    const rows = all.filter(k => poolShowUsed || !k.used);
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><b style="font-size:17px">${ic} ${title}</b>
        <span class="small mut">متاح ${free} • مستخدم ${all.length - free} • <b style="color:${auto > 3 ? "var(--ok)" : "var(--bad)"}">للتفعيل التلقائي: ${auto}</b></span>
        <button class="btn-acc" style="margin-inline-start:auto" onclick="poolNext('${provider}')">نسخ التالي المتاح</button></div>
      <div style="display:grid;gap:8px;margin-bottom:12px">
        ${rows.length ? rows.map(k => `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:${k.used ? "rgba(239,68,68,.07)" : "rgba(34,197,94,.07)"}">
          <span class="mono small" style="flex:1;min-width:150px">${esc(maskKey(k.api_key))}</span>
          ${k.pool === "system" ? `<span class="badge2" style="background:#3b2a66">نظام</span>` : ""}${k.label ? `<span class="small mut">${esc(k.label)}</span>` : ""}
          <span class="small" style="color:${k.used ? "var(--bad)" : "var(--ok)"}">${k.used ? "مستخدم • " + ago(k.used_at) : "متاح"}</span>
          <button class="btn-acc" style="padding:6px 12px" onclick="poolCopy(${k.id})">${k.used ? "نسخ مرة أخرى" : "نسخ"}</button>
          ${k.used ? `<button class="btn-ghost" style="padding:6px 10px" onclick="poolReset(${k.id})">إرجاع</button>` : ""}
          <button class="btn-ghost" style="padding:6px 10px;color:var(--bad)" onclick="poolDelete(${k.id})">حذف</button></div>`).join("") : `<div class="mut small">${all.length ? "كل المفاتيح مستخدمة. أضف مفاتيح جديدة أو اعرض المستخدمة." : "لا توجد مفاتيح بعد."}</div>`}
      </div>
      <label>إضافة مفاتيح (مفتاح في كل سطر)</label>
      <textarea id="pk-${provider}" rows="3" class="mono" placeholder="الصق المفاتيح هنا"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><select id="pp-${provider}" style="max-width:230px"><option value="users">للمستخدمين (تفعيل تلقائي)</option><option value="system">للنظام (محجوز، لا يُوزَّع)</option></select><input id="pl-${provider}" placeholder="ملاحظة (اختياري)" style="flex:1;min-width:120px"><button class="btn-ok" onclick="poolAdd('${provider}')">إضافة</button></div>
    </div>`;
  };
  const st = POOLINFO.stock, exhausted = st.gemini < 1 || st.groq < 1;
  $("#main").innerHTML = head("المفاتيح الجاهزة", "المفاتيح المسجّلة «للمستخدمين» تُوزَّع تلقائيًا: كل مستخدم جديد يأخذ مفتاح Gemini ومفتاح Groq ويُفعَّل حسابه، ثم يُحذف المفتاحان من القائمة فلا يتكرران. مفاتيح «النظام» محجوزة ولا تُعطى لأحد.", `<label class="small" style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" style="width:auto" ${poolShowUsed ? "checked" : ""} onchange="poolShowUsed=this.checked;rKeys()"> عرض المستخدمة</label>`) +
    `<div class="card" style="margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:${exhausted ? "var(--bad)" : "var(--line)"}">
      <label style="display:flex;align-items:center;gap:8px;margin:0;color:var(--text)"><input type="checkbox" style="width:auto" ${POOLINFO.auto_activate ? "checked" : ""} onchange="setAuto(this.checked)"> التفعيل التلقائي للمستخدمين</label>
      <span class="small mut">متاح للتوزيع: Gemini ${st.gemini} • Groq ${st.groq}</span>

const TYPE_L = { call: "مكالمات صوتية", chat: "رسائل محادثة", reminder: "تذكيرات", file: "ملفات", quota: "تنبيهات حد المفتاح" };
async function loadInsights(id) {
  const box = $("#insights"); if (!box) return;
  try {
    const d = await api(`/api/admin/users/${id}/insights`);
    if (!$("#insights")) return;
    const days = dayList(14), max = Math.max(1, ...days.map(x => (d.per_day.find(p => p.d === x) || { c: 0 }).c));
    const cnt = t => (d.counts.find(c => c.type === t) || { c: 0 }).c;
    const total = d.counts.reduce((a, c) => a + c.c, 0);
    box.innerHTML = `<b>📊 تحليل الاستخدام (آخر 30 يومًا)</b>
      <div class="grid g4" style="margin:10px 0">${["call", "chat", "reminder", "quota"].map(t => `<div style="background:#0a1229;border-radius:12px;padding:8px 10px"><div style="font-size:20px;font-weight:800">${cnt(t)}</div><div class="small mut">${TYPE_L[t]}</div></div>`).join("")}</div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:44px">${days.map(x => { const c = (d.per_day.find(p => p.d === x) || { c: 0 }).c; return `<div title="${x}: ${c}" style="flex:1;height:${Math.max(4, c / max * 100)}%;background:linear-gradient(#5b8cff,#8b5cf6);border-radius:3px;opacity:${c ? 1 : .25}"></div>`; }).join("")}</div>
      <div class="small mut" style="margin:4px 0 10px">إجمالي الأحداث: ${total}${total ? "" : " • لم يستخدم التطبيق بعد"}</div>

        : `<div class="small" style="color:var(--warn)">🔒 لم يوافق هذا المستخدم على مشاركة ملخصات المواضيع، فلا تظهر لك. أنت ترى فقط أرقام الاستخدام.</div>`}`;
  } catch (e) { if ($("#insights")) $("#insights").innerHTML = `<div class="small mut">تعذر تحميل التحليل.</div>`; }

function dayList(n) { return Array.from({ length: n }, (_, i) => new Date(Date.now() - (n - 1 - i) * 86400000).toISOString().slice(0, 10)); }
function bars(title, color, series) {
  const max = Math.max(1, ...series.map(s => s.v));
  return `<div class="card"><h3>${title} <span class="mut small">(آخر 14 يومًا • المجموع ${series.reduce((a, s) => a + s.v, 0)})</span></h3>
  <div style="display:flex;align-items:flex-end;gap:5px;height:130px">${series.map(s => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="${s.d}: ${s.v}">
    <span class="small mut" style="font-size:10px">${s.v || ""}</span><div style="width:100%;max-width:26px;height:${Math.max(3, s.v / max * 100)}%;background:linear-gradient(${color},rgba(139,92,246,.6));border-radius:6px 6px 2px 2px;opacity:${s.v ? 1 : .25}"></div></div>`).join("")}</div>
  <div style="display:flex;gap:5px;margin-top:6px">${series.map(s => `<span class="small mut" style="flex:1;text-align:center;font-size:9.5px">${s.d.slice(8)}</span>`).join("")}</div></div>`;
}

      <div class="notif"><div class="t" id="pt"></div><div class="b" id="pb"></div><div class="go ${composer.kind === "text" ? "hide" : ""}" id="pg"></div></div></div></div>
    <div class="card"><h3>الإشعارات المُرسلة</h3>${NOTICES.length ? NOTICES.map(n => `<div class="nitem" style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><b>${esc(n.title)}</b> <span class="badge2" style="background:#1a2750">${({ text: "نص", link: "رابط", video: "فيديو", image: "صورة" })[n.kind] || "نص"}</span>
      <div class="small mut">${esc(n.body).slice(0, 110)}</div><div class="small mut">${({ all: "للكل", "group:active": "للمفعّلين", "group:pending": "لمن بانتظار التفعيل", "group:blocked": "للموقوفين" })[n.target] || (String(n.target).startsWith("users:") ? "لمستخدمين محددين" : "لمستخدم محدد")} • ${n.publish_at ? `<b style="color:var(--warn)">⏰ مجدول: ${fmtDate(n.publish_at)}</b>` : fmtDate(n.created_at)}</div>${n.url ? `<div class="small mono"><a style="color:var(--acc)" target="_blank" href="${esc(n.url)}">${esc(n.url).slice(0, 48)}</a></div>` : ""}</div>
      <button class="btn-ghost" onclick="delNotice(${n.id})">حذف</button></div>`).join("") : `<div class="empty">لم تُرسل إشعارات بعد.</div>`}</div></div></div>`;
  const prev = () => {
    composer.users = [...document.querySelectorAll(".nusr:checked")].map(x => x.value);
    composer.when = $("#nmode").value === "later" ? ($("#nwhen").value || "") : "";
    $("#nwhen").classList.toggle("hide", $("#nmode").value !== "later");
    $("#usersbox").classList.toggle("hide", $("#ntarget").value !== "users");
    composer.title = $("#ntitle").value; composer.body = $("#nbody").value; composer.url = ($("#nurl") || {}).value || ""; composer.target = $("#ntarget").value;
    $("#pt").textContent = composer.title || "عنوان الإشعار"; $("#pb").textContent = composer.body || "نص الإشعار سيظهر هنا";
    $("#pg").textContent = composer.kind === "video" ? "▶ شاهد الفيديو" : composer.kind === "image" ? "🖼 عرض الصورة" : "🔗 افتح الرابط";
  };
  ["ntitle", "nbody", "nurl", "ntarget", "nmode", "nwhen"].forEach(i => $("#" + i) && ($("#" + i).oninput = prev));
  document.querySelectorAll(".nusr").forEach(x => x.onchange = prev);
  $("#seg").onclick = e => { const b = e.target.closest("[data-k]"); if (b) { prev(); composer.kind = b.dataset.k; rNotices(); } };
  $("#sendN").onclick = async () => {
    prev();
    const mode = $("#nmode").value;
    if (mode === "later" && !composer.when) return toast("اختر وقت الإرسال", "err");
    const target = composer.target === "users" ? "users:" + composer.users.join(",") : composer.target;
    try { const r = await api("/api/admin/notify", { method: "POST", body: JSON.stringify({ title: composer.title, body: composer.body, target, kind: composer.kind, url: composer.url, publish_at: mode === "later" ? new Date(composer.when).toISOString() : null }) });
      toast(r.scheduled ? "تمت الجدولة ✔" : "تم إرسال الإشعار ✔"); composer = { kind: "text", target: "all", title: "", body: "", url: "", when: "", users: [] }; await loadAll(); rNotices(); }
    catch (e) { toast(e.message, "err"); }
  };
  prev();
}
window.delNotice = async id => { await api("/api/admin/notifications/" + id, { method: "DELETE" }); toast("تم الحذف"); await loadAll(); rNotices(); };

/* ---------- updates ---------- */
function rUpdates() {
  const d = SETTINGS.detected || {};
  $("#main").innerHTML = head("التحديثات", "كيف يصل الإصدار الجديد للمستخدمين") + `
  <div class="grid g2">
    <div class="card"><h3>🔗 ربط GitHub</h3><div class="row">
      <div class="small mut">انشر Release في المستودع (وسم مثل v1.2.0 ومعه ملف APK). التطبيق يفحص تلقائيًا ويُظهر إشعار «تحديث جديد» لكل مستخدم.</div>
      <div><label>المستودع (owner/repo)</label><input id="repo" class="mono" value="${esc(SETTINGS.github_repo)}"></div>
      <div class="actions"><button class="btn-acc" onclick="saveUpd()">حفظ</button>${SETTINGS.github_repo ? `<a target="_blank" href="https://github.com/${esc(SETTINGS.github_repo)}/releases"><button class="btn-ghost">فتح صفحة الإصدارات</button></a>` : ""}</div></div></div>
    <div class="card"><h3>📦 الإصدار الذي يراه المستخدمون الآن</h3>${d.version ? `<div style="font-size:30px;font-weight:800">${esc(d.version)}</div>
      <div class="small mut" style="margin:4px 0 10px">المصدر: ${esc(d.source)}</div><div class="small" style="white-space:pre-line;margin-bottom:12px">${esc(d.notes || "")}</div>
      ${d.apk_url ? `<a target="_blank" href="${esc(d.apk_url)}"><button class="btn-acc">اختبار رابط التحميل</button></a>` : `<span style="color:var(--warn)">⚠ هذا الإصدار بلا ملف APK</span>`}` : `<div class="empty">لا يوجد إصدار.</div>`}</div>
    <div class="card" style="grid-column:1/-1"><h3>✍️ إصدار يدوي (اختياري)</h3><div class="small mut" style="margin-bottom:10px">لو كتبت إصدارًا ورابطًا هنا فسيُستخدم بدل GitHub. اتركهما فارغين للعودة إلى GitHub.</div>
      <div class="row two"><div><label>رقم الإصدار</label><input id="ver" class="mono" value="${esc(SETTINGS.latest_version)}" placeholder="1.2.0"></div><div><label>رابط ملف APK</label><input id="apk" class="mono" value="${esc(SETTINGS.apk_url)}" placeholder="https://..."></div></div>
      <div style="margin-top:12px"><label>ملاحظات التحديث</label><textarea id="notes" rows="3">${esc(SETTINGS.notes)}</textarea></div>
      <div class="actions" style="margin-top:12px"><button class="btn-acc" onclick="saveUpd()">حفظ</button></div></div></div>`;
}
window.saveUpd = async () => {
  try { await api("/api/admin/settings", { method: "POST", body: JSON.stringify({ github_repo: $("#repo").value, latest_version: $("#ver").value, apk_url: $("#apk").value, notes: $("#notes").value }) }); toast("تم الحفظ ✔"); await loadAll(); rUpdates(); }
  catch (e) { toast(e.message, "err"); }
};

/* ---------- settings ---------- */
function rSettings() {
  $("#main").innerHTML = head("الإعدادات", "بيانات المنصة") + `
  <div class="grid g2">
    <div class="card"><h3>💬 واتساب الإدارة</h3><div class="row"><div class="small mut">الرقم اللي بتتفتح عليه رسالة «تفعيل الحساب» من التطبيق (بصيغة دولية بدون +).</div>
      <input id="wa" class="mono" value="${esc(SETTINGS.whatsapp)}"><div class="actions"><button class="btn-acc" onclick="saveWa()">حفظ</button></div></div></div>
    <div class="card"><h3>🔐 كلمة مرور الإدارة</h3><div class="small mut" style="line-height:2">لأمانك لا تُغيَّر من هذه الصفحة. لتغييرها شغّل في PowerShell:</div>
      <div class="mono small" style="background:#0a1229;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px">npx.cmd wrangler secret put ADMIN_PASSWORD</div></div>
    <div class="card"><h3>🌐 روابط مفيدة</h3><div class="row small"><a style="color:var(--acc)" target="_blank" href="https://www.elhawyai.com/projects/eva">صفحة إيفا على الموقع</a><a style="color:var(--acc)" target="_blank" href="https://github.com/${esc(SETTINGS.github_repo || "conqer40/eva-android")}/releases">إصدارات التطبيق على GitHub</a></div></div>
    <div class="card"><h3>ℹ️ نصائح</h3><div class="small mut" style="line-height:2">• لا تفعّل مستخدمًا قبل إضافة المفتاحين.<br>• عند إيقاف حساب يختفي مفتاحه من تطبيقه عند أول فتح.<br>• المفاتيح تُخزَّن في قاعدة البيانات لتُسلَّم للتطبيق، فاحمِ كلمة مرور الإدارة.</div></div>
  </div>`;
}
window.saveWa = async () => { try { await api("/api/admin/settings", { method: "POST", body: JSON.stringify({ whatsapp: $("#wa").value }) }); toast("تم الحفظ ✔"); await loadAll(); } catch (e) { toast(e.message, "err"); } };

/* auto sign-in when a password is remembered for this tab */
if (PW) api("/api/admin/users").then(start).catch(() => sessionStorage.removeItem("eva_pw"));
</script>
</body>
</html>
