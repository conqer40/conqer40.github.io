<script>
const E={
1:{t:"الليلة اللي بدأت فيها كل حاجة",d:"الأحد 13 سبتمبر 2026 — الزقازيق — 9:18 مساءً",x:["البيت هادي. أميرة مع مختار وفريدة، وإنت قدام الكمبيوتر بين شغلك في اللوجستيات وHorizon وElhawy AI ومشروع F.R.I.D.A.Y.","فجأة الشاشة تسوّد، وبعد ثانيتين يظهر اللوجو الأزرق من غير ما تفتح البرنامج.","<div class='sys'>F.R.I.D.A.Y: UNAUTHORIZED CORE ACTIVATION\nوجدت مسارًا ماليًا غير معتاد: $2,847,350</div>","موبايلك يرن من رقم إماراتي. الصوت يعرض عليك <span class='money'>5 مليون جنيه</span> مقابل حذف ملفات قديمة.","F.R.I.D.A.Y تكتب: <span class='warn'>أحتاج 40 ثانية لتتبّع الاتصال.</span>"],c:[["B — كمّل الكلام وسيب F.R.I.D.A.Y تتبع",2,{risk:10,friday:8}],["C — واجهه عن الـ2.8 مليون دولار",4,{risk:18,trust:-3}],["D — اقفل واحكي لأميرة",3,{trust:8,risk:-4}]]},

3:{t:"أميرة تعرف",d:"13 سبتمبر 2026 — 9:20 مساءً",x:["تحكي لأميرة إن في ملف قديم طلع منه مسار مالي غريب وإن حد عرض عليك فلوس مقابل مسح ملفات.","هي ترد: «الفلوس مش مهمة… المهم البيت ما يدخلش في حاجة مش فاهمينها.»","ترجع للكمبيوتر وتلاقي محاولة الفحص الخارجي مستمرة."],c:[["ننقل الأولاد ونشغّل الطُعم",5,{trust:10,friday:10,risk:4}],["نقفل ونبدأ مسار قانوني",8,{trust:6,risk:-10}],["نكمّل التحقيق سوا",9,{trust:12,risk:5}]]},
4:{t:"السؤال الغلط في الوقت الصح",d:"13 سبتمبر 2026 — 9:20 مساءً",x:["تسأله مباشرة عن الـ2.8 مليون. يسكت، ثم يقول: «واضح إنك وصلت أبعد مما توقعت.»","بعد المكالمة يزيد الضغط على الشبكة. دلوقتي الطرف الآخر عارف إنك شفت الرقم."],c:[["فعّل بيئة طُعم",5,{friday:12,risk:12}],["احفظ الأدلة وروح لمحامي",8,{risk:-6,trust:3}],["تتبع أرشيف الشحن بنفسك",10,{risk:16,friday:5}]]},
5:{t:"البيت فاضي… والطُعم شغال",d:"13 سبتمبر 2026 — 9:22 مساءً",x:["تنفذ القرارين معًا: تحمي العيلة وتخدع الخصم. F.R.I.D.A.Y تنشئ ملفًا مغريًا اسمه MERIDIAN_FINAL_SETTLEMENT.pdf.","تنقل أميرة ومختار وفريدة لمكان آمن. وبعد دقائق: <span class='warn'>DECOY FILE ACCESSED</span>.","البصمة الرقمية ظهرت قبل كده على شبكة مكتب قديمة. الملف اتنسخ واتبعث إلى شركة خيالية اسمها Northstar Commodities & Logistics.","نفس الرقم يتصل: «الـ2.8 مليون مجرد بند واحد من سبعة… الإجمالي <span class='money'>$41,000,000</span>. والأسوأ إن جزءًا منها اتعمل باسمك.»","F.R.I.D.A.Y تجد حسابًا باسمك بقيمة <span class='money'>$6,430,880</span> لكنه مجمد ويطلب VERIFY IDENTITY."],c:[["حقق في الحساب من غير ما تلمسه",11,{friday:6,risk:4}],["ركز على الخائن داخل المنظومة",10,{risk:9}],["ابني Timeline من 2023 لليوم",12,{friday:8,risk:-2}],["اعمل التلاتة بالتوازي",13,{friday:14,risk:12,trust:-2}]]},

7:{t:"انسحاب تكتيكي",d:"13 سبتمبر 2026 — 9:27 مساءً",x:["تقفل الراوتر، تنسخ أهم الملفات على وسيط مشفر، وتخرج بالعيلة بهدوء.","تخسر فرصة معرفة أصحاب العربية، لكن تكسب مساحة تفكير وهدوء."],c:[["ابدأ تحقيق ورقي الصبح",12,{risk:-5,trust:5}],["سلّم الموضوع لمحامي ومحاسب جنائي",8,{risk:-8,money:-20000}]]},

9:{t:"شريكة القرار",d:"13 سبتمبر 2026 — 10:10 مساءً",x:["أميرة تقعد جنبك وتشوف الصورة كاملة. تلاحظ اسم شركة ظهر قبل كده في إيميل سفر مرتبط بالإمارات.","الربط يوضح إن القضية شبكة معاملات على أكتر من دولة."],c:[["ابني Timeline بمعاونة أميرة",12,{trust:15,friday:4}],["خليها تركز على سلامة العيلة وإنت تحقق",11,{trust:8,risk:-2}]]},

12:{t:"خط الزمن",d:"14 سبتمبر 2026 — 2:10 صباحًا",x:["تجمع شحنات، إيميلات، بنوك، شركات وسيطة وتواريخ تعديلات المستندات.","يظهر نمط: كل معاملة كبيرة سبقها تعديل صغير في مستند عادي. كل المسارات تلتقي عند اسم مختصر: <b>ARGO</b>."],c:[["اعرف ARGO مين",17,{friday:9,risk:4}],["ركز على الحلقة المالية",11,{risk:-1}],["حضّر بلاغًا رسميًا",20,{risk:2,trust:4}]]},
13:{t:"عملية المرآة",d:"14 سبتمبر 2026 — 2:35 صباحًا",x:["تأمر F.R.I.D.A.Y بتحقيق كامل لكن من مصادر مشروعة فقط: أرشيفك، مصادر عامة، وربط زمني.","النتيجة: 4 شركات، 7 معاملات، 3 دول، ونقطة مركزية واحدة: ARGO.","يصل عرض اجتماع في دبي: <span class='money'>20 مليون جنيه</span> مقابل تنازل وصمت."],c:[["ارفض واكمل",17,{risk:8,trust:3}],["تفاوض لكشف الهوية",18,{risk:10}],["وافق مبدئيًا كطُعم بدون توقيع",19,{risk:16,friday:5}]]},

15:{t:"مكالمة مروان",d:"14 سبتمبر 2026 — 11:00 صباحًا",x:["تكلمه بهدوء. لما تذكر Meridian Gate، صوته يتغير.","يعترف ضمنيًا إنه كان بيمرر مستندات، ويقول إن الشخص اللي فوقه يستخدم الاسم الحركي ARGO. ويطلب حماية مقابل كل اللي عنده."],c:[["خليه يسلّم الأدلة لمحامي",21,{risk:3}],["اطلب نسخة مشفرة وابدأ تحليلها",17,{friday:7,risk:5}]]},
16:{t:"الطُعم الثاني",d:"14 سبتمبر 2026 — 1:20 ظهرًا",x:["F.R.I.D.A.Y تجهز إشعارًا وهميًا بأن حساب الـ6.4 مليون أصبح جاهزًا للتحقق.","بعد ساعات، طرف ثالث يتحرك ويحاول التواصل مع الوسيط المالي. الاسم التجاري يقود إلى ARGO."],c:[["اجمع الأدلة وقدّمها رسميًا",20,{risk:-2,trust:4}],["استخدم المعلومة لفرض تسوية قانونية",18,{risk:6}]]},

18:{t:"طاولة التفاوض",d:"15 سبتمبر 2026 — 3:00 عصرًا",x:["عن طريق محامين، يبدأ تفاوض حقيقي. الشرط الأول منك: إلغاء أي تفويض أو حساب مرتبط باسمك، وكشف كل استخدام لهويتك.","الطرف يعرض <span class='money'>32 مليون جنيه</span> كتسوية وتعويض، لكن فقط إذا انتهت المنازعة قانونيًا."],c:[["اقبل بعد مراجعة كاملة",23,{money:32000000,risk:-8,trust:6}],["ارفض وكمّل رسمي",20,{risk:2,trust:4}],["اسأل أميرة قبل القرار",24,{trust:10}]]},
